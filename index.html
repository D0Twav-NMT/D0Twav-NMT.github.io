<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Panel Checklist Generator</title>
		<style>
						        * {
						            box-sizing: border-box;
						            margin: 0;
						            padding: 0;
						        }

						        body {
						            font-family: 'Georgia', 'Times New Roman', serif;
						            padding: 4px;
						            background-color: #fff;
						            min-height: 100vh;
						            transform-origin: top left;
						        }

						        h1 {
						            margin-bottom: 4px;
						            font-family: 'Arial Black', sans-serif;
						            text-align: center;
						            color: #333;
						            letter-spacing: 0.5px;
						            text-transform: uppercase;
						            font-size: 16px;
						            padding: 0 2px;
						        }

						        .controls {
						            position: fixed;
						            top: 5px;
						            right: 5px;
						            background: #fff;
						            padding: 6px;
						            border-radius: 3px;
						            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
						            z-index: 1000;
						            display: flex;
						            flex-direction: column;
						            gap: 4px;
						            align-items: stretch;
						            border: 1px solid #ddd;
						        }

						        .control-row {
						            display: flex;
						            align-items: center;
						            gap: 3px;
						            font-size: 10px;
						        }

						        .control-row label {
						            font-size: 9px;
						            font-weight: bold;
						            color: #666;
						            min-width: 55px;
						        }

						        input[type="range"] {
						            width: 50px;
						            cursor: pointer;
						        }

						        .layout-select {
						            width: 100%;
						            padding: 3px;
						            font-size: 9px;
						            border: 1px solid #ccc;
						            border-radius: 2px;
						            background: #fafafa;
						        }

						        .controls button {
						            padding: 4px 8px;
						            font-size: 9px;
						            border-radius: 2px;
						            background: #4a9eff;
						            color: white;
						            border: none;
						            cursor: pointer;
						        }

						        .file-input {
						            margin-bottom: 4px;
						            padding: 6px 8px;
						            background: #f8f8f8;
						            border-radius: 3px;
						            border: 1px dashed #ccc;
						        }

						        .file-input input[type="file"],
						        .file-input textarea {
						            margin-bottom: 3px;
						            font-size: 10px;
						        }

						        .container {
						            margin: 0;
						            padding: 0;
						        }

			/* Layout classes using CSS Grid - fills width perfectly */
			.container.layout-single {
			    display: grid;
			    grid-template-columns: 1fr;
			    gap: 2px;
			}

			.container.layout-double {
			    display: grid;
			    grid-template-columns: repeat(2, 1fr);
			    gap: 2px;
			}

			.container.layout-triple {
			    display: grid;
			    grid-template-columns: repeat(3, 1fr);
			    gap: 2px;
			}

			.container.layout-quadruple {
			    display: grid;
			    grid-template-columns: repeat(4, 1fr);
			    gap: 2px;
			}

			.panel-group {
			    background: #fff;
			    border: 1px solid #bbb;
			    border-radius: 2px;
			    margin: 0;
			    overflow: hidden;
			}
						        /* Print-optimized styles - light colors for minimal ink */
						        .panel-group {
						            background: #fff;
						            border: 1px solid #bbb;
						            border-radius: 2px;
						            margin-bottom: 2px;
						            overflow: hidden;
						        }

						        .panel-header {
						            display: flex;
						            align-items: center;
						            padding: 3px 5px;
						            background: linear-gradient(135deg, #e8f0fe 0%, #d0e2fc 100%);
						            color: #333;
						            border-bottom: 1px solid #bbb;
						        }

						        .panel-header input[type="checkbox"] {
						            width: 12px;
						            height: 12px;
						            margin-right: 5px;
						            cursor: pointer;
						            flex-shrink: 0;
						            accent-color: #4a9eff;
						        }

						        .panel-title {
						            font-weight: bold;
						            font-size: 11px;
						            font-family: 'Arial Black', sans-serif;
						            flex-grow: 1;
						            letter-spacing: 0.3px;
						            white-space: nowrap;
						            overflow: hidden;
						            text-overflow: ellipsis;
						            color: #333;
						        }

						        .panel-meta {
						            font-size: 8px;
						            color: #666;
						            margin-top: 1px;
						            font-family: 'Georgia', serif;
						            line-height: 1.1;
						        }

						        .panel-meta span {
						            margin-right: 8px;
						        }

						        .item-list {
						            padding: 0;
						            background: #fff;
						        }

						        .checklist-item {
						            display: flex;
						            align-items: center;
						            padding: 2px 4px 2px 6px;
						            border-bottom: 1px solid #eee;
						            width: 100%;
						            font-family: 'Georgia', serif;
						            font-size: 9px;
						        }

						        .checklist-item:last-child {
						            border-bottom: none;
						        }

						        .checklist-item input[type="checkbox"] {
						            width: 11px;
						            height: 11px;
						            margin-right: 4px;
						            cursor: pointer;
						            flex-shrink: 0;
						            accent-color: #4a9eff;
						        }

						        .part-number {
						            font-weight: bold;
						            font-size: 10px;
						            min-width: 60px;
						            color: #333;
						            font-family: 'Arial', sans-serif;
						        }

						        .length {
						            font-size: 9px;
						            color: #777;
						            margin-left: 3px;
						            white-space: nowrap;
						            font-style: italic;
						        }

						        .quantity {
						            margin-left: 5px;
						            font-weight: bold;
						            color: #4a9eff;
						            min-width: 20px;
						        }

						        .radio-circle {
						            width: 9px;
						            height: 9px;
						            border: 1px solid #bbb;
						            border-radius: 50%;
						            margin-left: auto;
						            flex-shrink: 0;
						            cursor: pointer;
						            transition: all 0.2s ease;
						            background: transparent;
						        }

						        .checklist-item:hover {
						            background: #f8f9fa;
						        }

						        .checklist-item.checked {
						            opacity: 0.4;
						            background: #f5f5f5;
						            text-decoration: line-through;
						        }

						        .checklist-item.checked .radio-circle {
						            background: #ccc;
						            border-color: #999;
						        }

						        .panel-group.checked .item-list {
						            display: none;
						        }

						        .panel-group.checked .panel-header {
						            opacity: 0.7;
						            background: #f0f0f0;
						        }

						        @media (max-width: 768px) {
			    .container.layout-double,
			    .container.layout-triple,
			    .container.layout-quadruple {
			        grid-template-columns: 1fr !important;
			    }

			    .panel-title {
			        font-size: 10px;
			    }

			    .part-number {
			        font-size: 9px;
			        min-width: 45px;
			    }
			}

						        @media print {
						            .controls, .file-input, #csvTextInput {
						                display: none !important;
						            }

						            body {
						                padding: 0;
						                margin: 0;
						            }

						            .panel-group {
						                break-inside: avoid;
						                page-break-inside: avoid;
						            }

						            h1 {
						                font-size: 14px;
						                margin-bottom: 3px;
						            }

						            /* Ensure optimal page fill */
						            @media print {
    /* ... existing styles ... */
    
    .container {
        width: 100% !important;
        max-width: none !important;
        page-break-before: auto !important;
    }
    
    .container.layout-single {
        grid-template-columns: 1fr !important;
    }
    
    .container.layout-double {
        grid-template-columns: repeat(2, 1fr) !important;
    }
    
    .container.layout-triple {
        grid-template-columns: repeat(3, 1fr) !important;
    }
    
    .container.layout-quadruple {
        grid-template-columns: repeat(4, 1fr) !important;
    }
}
		</style>
	</head>
	<body>
		<div class="controls">
			<div class="control-row">
				<label>Layout:</label>
				<select
					id="layoutSelect"
					class="layout-select"
					onchange="changeLayout()"
				>
					<option value="single">Single (1 col)</option>
					<option value="double">Double (2 cols)</option>
					<option value="triple">Triple (3 cols)</option>
					<option value="quadruple">Quad (4 cols)</option>
				</select>
			</div>
			<div class="control-row">
				<label>Scale:</label>
				<input
					type="range"
					id="scaleSlider"
					min="50"
					max="120"
					value="100"
					step="5"
				/>
				<span id="scaleValue">100%</span>
			</div>
			<button onclick="window.print()">Print</button>
		</div>

		<h1>Panel Checklist</h1>

		<div class="file-input">
			<textarea
				id="csvTextInput"
				placeholder="Paste CSV content here..."
				style="width: 100%; height: 70px; padding: 6px; font-family: monospace; font-size: 10px; border: 1px solid #ccc; border-radius: 2px;"
			></textarea>
			<button
				onclick="parseFromTextarea()"
				style="margin-bottom: 4px; padding: 4px 10px; background: #4a9eff; color: white; border: none; border-radius: 2px; cursor: pointer; font-size: 10px;"
			>
				Process CSV
			</button>
			<div
				style="margin-top: 4px; padding-top: 4px; border-top: 1px dashed #ccc;"
			>
				<p style="font-size: 9px; margin-bottom: 2px;">
					<strong>Or upload file:</strong>
				</p>
				<input
					type="file"
					id="csvFileInput"
					accept=".csv,.txt"
					style="font-size: 10px;"
				/>
			</div>
		</div>

		<div class="container layout-single" id="container">
			<div id="checklist"></div>
		</div>

		<script>
						document.getElementById('csvFileInput').addEventListener('change', function(e) {
						    const file = e.target.files[0];
						    if (!file) return;
						    processFile(file);
						});

						document.getElementById('scaleSlider').addEventListener('input', function(e) {
						    const scale = e.target.value;
						    document.getElementById('container').style.transform = `scale(${scale/100})`;
						    document.getElementById('container').style.transformOrigin = 'top left';
						    document.getElementById('scaleValue').textContent = `${scale}%`;
						});
			function changeLayout() {
			    const container = document.getElementById('container');
			    const layout = document.getElementById('layoutSelect').value;

			    container.classList.remove('layout-single', 'layout-double', 'layout-triple', 'layout-quadruple');
			    container.classList.add(`layout-${layout}`);

			    // No manual scale adjustment needed - Grid handles width perfectly
			    document.getElementById('scaleSlider').value = '100';
			    document.getElementById('scaleValue').textContent = '100%';
			    container.style.transform = `scale(1)`;
			}

						function parseFromTextarea() {
						    const csvText = document.getElementById('csvTextInput').value;
						    if (csvText.trim()) {
						        parseCSV(csvText);
						    }
						}

						function processFile(file) {
						    const reader = new FileReader();
						    reader.onload = function(event) {
						        const csvText = event.target.result;
						        parseCSV(csvText);
						    };
						    reader.readAsText(file);
						}

						function parseCSVLine(line) {
						    const result = [];
						    let current = '';
						    let inQuotes = false;

						    for (let i = 0; i < line.length; i++) {
						        const char = line[i];

						        if (char === '"') {
						            inQuotes = !inQuotes;
						        } else if (char === ',' && !inQuotes) {
						            result.push(current.trim());
						            current = '';
						        } else {
						            current += char;
						        }
						    }
						    result.push(current.trim());
						    return result;
						}

						function parseCSV(csvText) {
						    const lines = csvText.trim().split('\n');
						    const groups = {};

						    for (let i = 1; i < lines.length; i++) {
						        const line = lines[i].trim();
						        if (!line || /^,+/.test(line)) continue;

						        const columns = parseCSVLine(line);

						        if (columns.length >= 4) {
						            const panel = columns[0].trim();
						            const part = columns[1].trim();
						            const quantity = columns[2].trim();
						            const length = columns[3].trim();

						            if (!groups[panel]) {
						                groups[panel] = [];
						            }

						            groups[panel].push({ part, quantity, length });
						        }
						    }

						    renderChecklist(groups);
						}

						function renderChecklist(groups) {
						    var hasData = Object.keys(groups).length > 0;
						    if (hasData) {
						        document.querySelector('.file-input').classList.add('hidden');
						    }
						    var container = document.getElementById('checklist');
						    container.innerHTML = '';

						    var sortedPanels = Object.keys(groups).sort((a, b) => {
						        const numA = parseFloat(a.replace(/[^0-9.-]/g, ''));
						        const numB = parseFloat(b.replace(/[^0-9.-]/g, ''));
						        return (numA - numB) || a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
						    });

						    sortedPanels.forEach(panel => {
						        let items = groups[panel];

						        items.sort((a, b) => {
						            return a.part.localeCompare(b.part, undefined, { numeric: true, sensitivity: 'base' });
						        });

						        const panelDiv = document.createElement('div');
						        panelDiv.className = 'panel-group';
						        panelDiv.dataset.panel = panel;

						        panelDiv.innerHTML = `
						            <div class="panel-header">
						                <input type="checkbox" onchange="togglePanel(this)">
						                <div>
						                    <span class="panel-title">Panel ${escapeHtml(panel)}</span>
						                    <div class="panel-meta">
						                        <span><strong>Shape:</strong> ____________</span>
						                        <span><strong>Color:</strong> ____________</span>
						                    </div>
						                </div>
						            </div>
						            <div class="item-list">
						                ${items.map(item => `
						                    <div class="checklist-item" onclick="toggleItem(this)">
						                        <input type="checkbox" onchange="event.stopPropagation()">
						                        <span class="part-number">${escapeHtml(item.part)}</span>
						                        <span class="length">(${escapeHtml(item.length)})</span>
						                        <span class="quantity">[${escapeHtml(item.quantity)}]</span>
						                        <div class="radio-circle" onclick="toggleRadio(this)"></div>
						                    </div>
						                `).join('')}
						            </div>
						        `;

						        container.appendChild(panelDiv);
						    });
						}

						function togglePanel(checkbox) {
						    const panel = checkbox.closest('.panel-group');
						    panel.classList.toggle('checked');
						}

						function toggleItem(item) {
						    item.classList.toggle('checked');
						    const checkbox = item.querySelector('input[type="checkbox"]');
						    checkbox.checked = !checkbox.checked;
						}

						function toggleRadio(circle) {
						    const item = circle.closest('.checklist-item');
						    item.classList.toggle('checked');
						    const checkbox = item.querySelector('input[type="checkbox"]');
						    checkbox.checked = !checkbox.checked;
						}

						function escapeHtml(text) {
						    const div = document.createElement('div');
						    div.textContent = text;
						    return div.innerHTML;
						}

						// Drag and drop support
						document.addEventListener('DOMContentLoaded', function() {
						    const dropZone = document.querySelector('.file-input');

						    dropZone.addEventListener('dragover', function(e) {
						        e.preventDefault();
						        dropZone.style.borderColor = '#4a9eff';
						        dropZone.style.background = '#f0f7ff';
						    });

						    dropZone.addEventListener('dragleave', function(e) {
						        e.preventDefault();
						        dropZone.style.borderColor = '#ccc';
						        dropZone.style.background = '#f8f8f8';
						    });

						    dropZone.addEventListener('drop', function(e) {
						        e.preventDefault();
						        dropZone.style.borderColor = '#ccc';
						        dropZone.style.background = '#f8f8f8';

						        const files = e.dataTransfer.files;
						        if (files.length > 0) {
						            processFile(files[0]);
						        }
						    });
						});

						// Paste CSV text support
						document.addEventListener('paste', function(e) {
						    const pastedText = e.clipboardData.getData('text');
						    if (pastedText.includes(',') && pastedText.includes('\n')) {
						        parseCSV(pastedText);
						    }
						});
		</script>
	</body>
</html>
